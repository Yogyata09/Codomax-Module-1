
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Inkly — Register</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">inkly<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
    </nav>
    <a class="btn btn-light" href="index.html">← Back home</a>
  </header>

  <main class="auth-layout">
    <section class="auth-intro">
      <span class="eyebrow">YOUR STORY STARTS HERE</span>
      <h1>Good stories begin with curious people.</h1>
      <p>Join a community where ideas grow, perspectives meet, and every voice has room.</p>
    </section>

    <section class="auth-form">
      <h2>Create account</h2>
      <p class="form-subtitle">It only takes a moment to get started.</p>

      <form id="registerForm">
        <div class="field">
          <label for="registerName">Full name</label>
          <input id="registerName" type="text" placeholder="Your name" minlength="2" required>
        </div>
        <div class="field">
          <label for="registerEmail">Email address</label>
          <input id="registerEmail" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button class="btn btn-primary btn-full" type="submit">Create my account →</button>
        <p id="registerMessage" class="message" aria-live="polite"></p>
      </form>

      <p class="form-bottom">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
